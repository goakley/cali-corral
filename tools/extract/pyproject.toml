[project]
name = "calcrim-extract"
version = "0.1.0"
description = "CALCRIM PDF download, extraction and normalization (maintainer tooling)"
readme = "README.md"
authors = [{ name = "Cali Corral contributors" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pdfplumber>=0.11.10",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[project.scripts]
calcrim-extract = "calcrim_extract.cli:main"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E731", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
