schema: 1
id: "592"
title: "Gross Vehicular Manslaughter (Pen. Code, § 192(c)(1))"
source:
  file: "calcrim-2026"
  release: "2026-10"
  revision_line: "New January 2006; Revised February 2015, September 2020, September 2023, October 2025"
  body_sha256: "3709730d09c2d9f911b20295f0ecb76e64040cb77e94795f8e9f8c06dd481446"
review: "machine-checked"
questions:
  - { id: in_count, type: boolean, prompt: "Include “in Count ___”?" }
  - id: in_violation_penal_code
    type: boolean
    prompt: "Include “in violation of Penal Code section 192(c)(1)”?"
  - id: defendant_is_charged_in
    type: boolean
    prompt: "Include “The defendant is charged [in Count ___] with gross vehicular manslaug…”?"
  - id: gross_vehicular_manslaughter_is
    type: boolean
    prompt: "Include “Gross vehicular manslaughter is a lesser crime than gross vehicular m…”?"
  - id: drove_vehicle_operated_vessel
    type: choice
    options: [ { id: o1, label: "drove a vehicle" }, { id: o2, label: "operated a vessel" } ]
    prompt: "Choose one"
  - id: driving_that_vehicle_operating
    type: choice
    options: [ { id: o1, label: "driving that vehicle" }, { id: o2, label: "operating that vessel" } ]
    prompt: "Choose one"
  - id: a_or_an
