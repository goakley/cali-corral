  - id: he
    type: multi
    options: [ { id: o1, label: he }, { id: o2, label: she } ]
    prompt: "Which apply? (one or more)"
body:
  - - { choice: the_or_a, options: [ [ "The" ], [ "A" ] ] }
    - " defendant is not responsible for any acts that were done before "
    - { any: he, options: [ [ he ], [ { sep: or }, " she" ] ] }
    - " joined the conspiracy."
  - - "You may consider evidence of acts or statements made before the defendant joined the conspiracy only to show the nature and goals of the conspiracy. You may not consider any such evidence to prove that the defendant is guilty of any crimes committed before "
    - { any: he, options: [ [ he ], [ { sep: or }, " she" ] ] }
    - " joined the conspiracy."
