# CALCRIM No. 860. Instruction text: Judicial Council of California, freely
# reproducible under Cal. Rules of Court, rule 2.1050(c). Template structure: CC0.
schema: 1
id: "860"
title: "Assault on Firefighter or Peace Officer With Deadly Weapon or Force Likely to Produce Great Bodily Injury (Pen. Code, §§ 240, 245(c) & (d))"
source:
  file: calcrim-2026
  release: "2026-10"
  revision_line: "New January 2006; Revised April 2011, February 2012, February 2013, September 2019, April 2020, September 2020, March 2022, February 2025, October 2025"
  body_sha256: "492e45203162fc1409b553aa4fa509ba74d9d2870cc684e2d9a4e7a58044de75"
review: machine-checked
people:
  victim: { label: "Person assaulted (firefighter or peace officer)", uses: [title, agency] }
related:
  - { id: "2670", reason: "Lawful performance: peace officer (element 5)." }
  - { id: "3470", reason: "Self-defense instructions when element 7 is given." }
questions:
  - { id: count_ref, type: boolean, prompt: "Name the count?" }
  - { id: cite_statute, type: boolean, prompt: "Cite Penal Code section 245?" }
  - id: means
    type: choice
    prompt: "Assault with…"
    options:
      - { id: force, label: "force likely to produce great bodily injury" }
      - { id: deadly_weapon, label: "a deadly weapon" }
      - { id: firearm, label: "a firearm" }
      - { id: semiauto, label: "a semiautomatic firearm" }
      - { id: machine_gun, label: "a machine gun" }
      - { id: assault_weapon, label: "an assault weapon" }
      - { id: bmg, label: "a .50 BMG rifle" }
  - id: victim_kind
    type: choice
    prompt: "The person assaulted was a…"
    options: [{ id: firefighter, label: "firefighter" }, { id: peace_officer, label: "peace officer" }]
  - id: theory
    type: multi
    prompt: "Element 1 alternatives"
    options:
      - { id: weapon, label: "1A — force with weapon" }
      - { id: force, label: "1B — force without weapon" }
  - id: weapon
    type: choice
    prompt: "Weapon in element 1A"
    options:
      - { id: deadly_weapon, label: "a deadly weapon" }
      - { id: firearm, label: "a firearm" }
      - { id: semiauto, label: "a semiautomatic firearm" }
      - { id: machine_gun, label: "a machine gun" }
      - { id: assault_weapon, label: "an assault weapon" }
      - { id: bmg, label: "a .50 BMG rifle" }
  - { id: self_defense, type: boolean, prompt: "Instructing on self-defense or defense of another (element 7)?" }
  - id: defense_kind
    type: multi
    prompt: "Which defenses?"
    options: [{ id: self, label: "self-defense" }, { id: other, label: "defense of someone else" }]
  - { id: indirect, type: boolean, prompt: "Give the indirect-touching paragraph?" }
  - id: indirect_how
    type: multi
    prompt: "How was the touching indirect?"
    options:
      - { id: object, label: "by causing an object [or someone else] to touch the other person" }
      - { id: held, label: "by touching something held by or attached to the other person" }
  - { id: indirect_someone_else, type: boolean, prompt: "Include “or someone else”?" }
  - { id: no_touch_required, type: boolean, prompt: "Say the People need not prove an actual touching?" }
  - { id: what_kind, type: boolean, prompt: "Add “and if so, what kind of assault it was”?" }
  - { id: intoxication, type: boolean, prompt: "Say voluntary intoxication is not a defense?" }
  - { id: def_gbi, type: boolean, prompt: "Define great bodily injury?" }
  - { id: def_deadly_weapon, type: boolean, prompt: "Define deadly weapon?" }
  - { id: def_inherently_deadly_clause, type: boolean, prompt: "Include “that is inherently deadly or one”?" }
  - { id: def_inherently_deadly, type: boolean, prompt: "Define inherently deadly?" }
  - { id: surrounding_circumstances, type: boolean, prompt: "Say to consider all the surrounding circumstances?" }
  - { id: def_firearm, type: boolean, prompt: "Define firearm?" }
  - { id: def_semiauto, type: boolean, prompt: "Define semiautomatic firearm?" }
  - { id: def_machine_gun, type: boolean, prompt: "Define machine gun?" }
  - id: machine_gun_how
    type: multi
    prompt: "A machine gun is any weapon that…"
    options:
      - { id: shoots, label: "shoots" }
      - { id: designed, label: "is designed to shoot" }
      - { id: restored, label: "can readily be restored to shoot" }
  - { id: def_assault_weapon, type: boolean, prompt: "Define assault weapon?" }
  - { id: def_bmg, type: boolean, prompt: "Define .50 BMG rifle?" }
  - { id: bmg_not_assault, type: boolean, prompt: "Add “and that is not an assault weapon or a machine gun”?" }
  - { id: defined_elsewhere, type: boolean, prompt: "Say some terms are defined in another instruction?" }
  - id: defined_terms
    type: multi
    prompt: "Terms defined in another instruction"
    options:
      - { id: gbi, label: "great bodily injury" }
      - { id: deadly_weapon, label: "deadly weapon" }
      - { id: firearm, label: "firearm" }
      - { id: machine_gun, label: "machine gun" }
      - { id: assault_weapon, label: "assault weapon" }
      - { id: bmg, label: ".50 BMG rifle" }
  - { id: police_def, type: boolean, prompt: "Define peace officer by police employment?" }
  - { id: designated_def, type: boolean, prompt: "Define peace officer by agency designation?" }
  - { id: duties_def, type: boolean, prompt: "List the officer's duties?" }
  - { id: firefighter_def, type: boolean, prompt: "Define firefighter?" }
  - id: ff_agency
    type: choice
    prompt: "Firefighter's agency"
    options:
      - { id: state, label: "governmentally operated … in this state" }
      - { id: federal_dept, label: "federal fire department" }
      - { id: federal_agency, label: "federal fire protection or firefighting agency" }
  - id: ff_state_kind
    type: choice
    prompt: "Governmentally operated…"
    options:
      - { id: dept, label: "fire department" }
      - { id: agency, label: "fire protection or firefighting agency" }
body:
  - - "The defendant is charged "
    - { opt: ["in Count ", { field: count }], if: count_ref }
    - " with assault with "
    - choice: means
      options:
        - "force likely to produce great bodily injury"
        - "a deadly weapon"
        - "a firearm"
        - "a semiautomatic firearm"
        - "a machine gun"
        - "an assault weapon"
        - "a .50 BMG rifle"
    - " on a "
    - { choice: victim_kind, options: ["firefighter", "peace officer"] }
    - " "
    - { opt: "in violation of Penal Code section 245", if: cite_statute }
    - "."
  - ["To prove that the defendant is guilty of this crime, the People must prove ", { opt: "either", if: "theory>1" }, " that:"]
  - elements:
      - alt: theory
        or: "[OR]"
        options:
          - note: "Alternative 1A—force with weapon"
            elements:
              - n: "1A"
                text:
                  - "The defendant did an act with "
                  - choice: weapon
                    options: ["a deadly weapon", "a firearm", "a semiautomatic firearm", "a machine gun", "an assault weapon", "a .50 BMG rifle"]
                  - " that by its nature would directly and probably result in the application of force to a person"
                end: ";"
          - note: "Alternative 1B—force without weapon"
            elements:
              - n: "1Bi"
                text: "The defendant did an act that by its nature would directly and probably result in the application of force to a person, and"
                end: ""
              - n: "1Bii"
                text: "The force used was likely to produce great bodily injury"
                end: ";"
      - { n: "2", text: "The defendant did that act willfully", end: ";" }
      - n: "3"
        text:
          - "When the defendant acted, "
          - { pronoun: defendant, forms: [he, she] }
          - " "
          - { agree: defendant, sg: was, pl: were }
          - " aware of facts that would lead a reasonable person to realize that "
          - { pronoun: defendant, forms: [his, her] }
          - " act by its nature would directly and probably result in the application of force to someone"
        end: ";"
      - n: "4"
        text:
          - "When the defendant acted, "
          - { pronoun: defendant, forms: [he, she] }
          - " had the present ability to apply force "
          - choice: means
            options:
              - "likely to produce great bodily injury"
              - "with a deadly weapon"
              - "with a firearm"
              - "with a semiautomatic firearm"
              - "with a machine gun"
              - "with an assault weapon"
              - "with a .50 BMG rifle"
          - " to a person"
        end: ";"
      - n: "5"
        text:
          - "When the defendant acted, the person assaulted was lawfully performing "
          - { pronoun: victim, forms: [his, her] }
          - " duties as a "
          - { choice: victim_kind, options: ["firefighter", "peace officer"] }
        end: ";"
      - n: "6"
        and: "[AND]"
        text:
          - "When the defendant acted, "
          - { pronoun: defendant, forms: [he, she] }
          - " knew, or reasonably should have known, that the person assaulted was a "
          - { choice: victim_kind, options: ["firefighter", "peace officer"] }
          - " who was performing "
          - { pronoun: victim, forms: [his, her] }
          - " duties"
        end: "(;/.)"
      - { note: "Give element 7 when instructing on self-defense or defense of another.", governs: [self_defense] }
      - n: "7"
        if: self_defense
        and: "AND"
        text:
          - "The defendant did not act "
          - { any: defense_kind, options: ["in self-defense", [{ sep: "or" }, " in defense of someone else"]] }
        end: "."
  - - "Someone commits an act "
    - { em: "willfully" }
    - " when he or she does it willingly or on purpose. It is not required that he or she intend to break the law, hurt someone else, or gain any advantage."
  - - "The terms "
    - { em: "application of force" }
    - " and "
    - { em: "apply force" }
    - " mean to touch in a harmful or offensive manner. The slightest touching can be enough if it is done in a rude or angry way. Making contact with another person, including through his or her clothing, is enough. The touching does not have to cause pain or injury of any kind."
  - opt:
      - - "The touching can be done indirectly "
        - any: indirect_how
          options:
            - ["by causing an object ", { opt: "or someone else", if: indirect_someone_else }, " to touch the other person"]
            - [{ sep: "or" }, " by touching something held by or attached to the other person"]
        - "."
    if: indirect
  - opt: ["The People are not required to prove that the defendant actually touched someone."]
    if: no_touch_required
  - - "The People are not required to prove that the defendant actually intended to use force against someone when "
    - { pronoun: defendant, forms: [he, she] }
    - " acted."
  - - "No one needs to actually have been injured by defendant’s act. But if someone was injured, you may consider that fact, along with all the other evidence, in deciding whether the defendant committed an assault"
    - { opt: ", and if so, what kind of assault it was", if: what_kind }
    - "."
  - opt: ["Voluntary intoxication is not a defense to assault."]
    if: intoxication
  - opt:
      - [{ em: "Great bodily injury" }, " means significant or substantial physical injury. It is an injury that is greater than moderate harm."]
    if: def_gbi
  - opt:
      - - "A "
        - { em: "deadly weapon" }
        - " is any object, instrument, or weapon "
        - { opt: "that is inherently deadly or one", if: def_inherently_deadly_clause }
        - " that is used in such a way that it is capable of causing and likely to cause death or great bodily injury."
    if: def_deadly_weapon
  - opt:
      - ["An object is ", { em: "inherently deadly" }, " if it is deadly or dangerous in the ordinary use for which it is designed."]
    if: def_inherently_deadly
  - opt: ["In deciding whether an object is a deadly weapon, consider all the surrounding circumstances."]
    if: surrounding_circumstances
  - opt:
      - ["A ", { em: "firearm" }, " is any device designed to be used as a weapon, from which a projectile is discharged or expelled through a barrel by the force of an explosion or other form of combustion."]
    if: def_firearm
  - opt:
      - ["A ", { em: "semiautomatic firearm" }, " extracts a fired cartridge and chambers a fresh cartridge with each single pull of the trigger."]
    if: def_semiauto
  - opt:
      - - "A "
        - { em: "machine gun" }
        - " is any weapon that "
        - any: machine_gun_how
          options: ["shoots", "is designed to shoot", [{ sep: "or" }, " can readily be restored to shoot"]]
        - " automatically more than one shot by a single function of the trigger and without manual reloading."
    if: def_machine_gun
  - opt:
      - - "An "
        - { em: "assault weapon" }
        - " includes "
        - { field: text.assault_weapons, hint: "insert names of appropriate designated assault weapons listed in Pen. Code, § 30510 and further defined by Pen. Code, § 30515" }
        - "."
    if: def_assault_weapon
  - opt:
      - - "A "
        - { em: ".50 BMG rifle" }
        - " is a center fire rifle that can fire a .50 BMG cartridge "
        - { opt: "and that is not an assault weapon or a machine gun", if: bmg_not_assault }
        - ". A "
        - { em: ".50 BMG cartridge" }
        - " is a cartridge that is designed and intended to be fired from a center fire rifle and that has all three of the following characteristics:"
      - elements:
          - { n: "1", text: "The overall length is 5.54 inches from the base of the cartridge to the tip of the bullet", end: ";" }
          - { n: "2", text: "The bullet diameter for the cartridge is from .510 to, and including, .511 inch", end: ";" }
          - { n: "3", and: "AND", text: "The case base diameter for the cartridge is from .800 inch to, and including, .804 inch", end: "." }
    if: def_bmg
  - opt:
      - - "The term"
        - { opt: "s", if: "defined_terms>1" }
        - " "
        - any: defined_terms
          options:
            - [{ em: "great bodily injury" }, { sep: "," }]
            - [{ em: "deadly weapon" }, { sep: "," }]
            - [{ em: "firearm" }, { sep: "," }]
            - [{ em: "machine gun" }, { sep: "," }]
            - [{ em: "assault weapon" }, { sep: "," }]
            - [{ sep: "and" }, " ", { em: ".50 BMG rifle" }]
        - " "
        - { when: ["!defined_terms>1", "defined_terms>1"], options: ["is", "are"] }
        - " defined in another instruction to which you should refer."
    if: defined_elsewhere
  - opt:
      - - "A person who is employed as a police officer by "
        - { field: victim.agency, hint: "insert name of agency that employs police officer" }
        - " is a "
        - { em: "peace officer" }
        - "."
    if: police_def
  - opt:
      - - "A person employed by "
        - { field: victim.agency, hint: "insert name of agency that employs peace officer, e.g., “the Department of Fish and Wildlife”" }
        - " is a "
        - { em: "peace officer" }
        - " if "
        - { field: text.designation_facts, hint: "insert description of facts necessary to make employee a peace officer, e.g., “designated by the director of the agency as a peace officer”" }
        - "."
    if: designated_def
  - opt:
      - - "The duties of a "
        - { field: victim.title, hint: "insert title of officer" }
        - " include "
        - { field: text.duties, hint: "insert job duties" }
        - "."
    if: duties_def
  - opt:
      - - "A "
        - { em: "firefighter" }
        - " includes anyone who is an officer, employee, or member of a "
        - choice: ff_agency
          options:
            - ["governmentally operated ", { choice: ff_state_kind, options: ["fire department", "fire protection or firefighting agency"] }, " in this state"]
            - "federal fire department"
            - "federal fire protection or firefighting agency"
        - ", whether or not he or she is paid for his or her services."
    if: firefighter_def
