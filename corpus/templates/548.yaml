questions: []
body:
  - [ "The defendant has been prosecuted for murder under multiple theories." ]
  - [ "Each theory of murder has different requirements, and I will instruct you on each." ]
  - - "You may not find the defendant guilty of murder unless all of you agree that the People have proved that the defendant committed murder. You need not all agree on the same theory but you must unanimously agree on the degree of murder."
