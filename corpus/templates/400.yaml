title: "Aiding and Abetting: General Principles"
source:
  file: "calcrim-2026"
  release: "2026-10"
  revision_line: "New January 2006; Revised June 2007, August 2009, April 2010, February 2026"
  body_sha256: "1baceeb10091c12dc50b434987103bf5e4ac6e862fbd63819a612aa4a2039493"
