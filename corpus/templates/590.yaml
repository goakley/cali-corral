# CALCRIM No. 590. Instruction text: Judicial Council of California, freely
# reproducible under Cal. Rules of Court, rule 2.1050(c). Template structure: CC0.
schema: 1
id: "590"
title: "Gross Vehicular Manslaughter While Intoxicated (Pen. Code, § 191.5(a))"
source:
  file: "calcrim-2026-supplement"
  release: "2026-10"
  revision_line: "New January 2006; Revised June 2007, September 2020, October 2025, October 2026*"
  body_sha256: "0d1f10c356a0b8110b79e1f0f20bdb585d8c93e55600e479b1ad2fbe8308e702"
review: "machine-checked"
questions:
  - { id: in_count, type: boolean, prompt: "Include “in Count ___”?" }
  - id: in_violation_penal_code
    type: boolean
    prompt: "Include “in violation of Penal Code section 191.5(a)”?"
  - id: alcoholic_beverage
    type: multi
    options: [ { id: o1, label: "an alcoholic beverage" }, { id: o2, label: "a drug" } ]
    prompt: "Which apply? (one or more)"
  - id: under_combined_influence_alcoholic
    type: boolean
    prompt: "Include “or under the combined influence of an alcoholic beverage and a drug”?"
  - id: drove_under_influence_alcoholic
    type: choice
    options:
      - id: o1
        label: "drove under the influence of (an alcoholic beverage/[or] a drug) [or under the…"
      - { id: o2, label: "drove while having a blood alcohol level of 0.08 or higher" }
      - id: o3
        label: "drove under the influence of (an alcoholic beverage/[or] a drug) [or under the…"
      - id: o4
        label: "drove while having a blood alcohol level of 0.05 or higher when under the age o…"
    prompt: "Choose one"
  - id: a_or_an
    type: choice
    options: [ { id: o1, label: a }, { id: o2, label: an } ]
    prompt: "Choose one"
  - id: misdemeanor
    type: multi
    options:
      - { id: o1, label: misdemeanor }
      - { id: o2, label: infraction }
      - { id: o3, label: "otherwise lawful act that might cause death" }
    prompt: "Which apply? (one or more)"
  - id: misdemeanor_s
    type: multi
    options: [ { id: o1, label: "misdemeanor[s]" }, { id: o2, label: "infraction[s]" } ]
    prompt: "Which apply? (one or more)"
  - id: people_allege_that_defendant
    type: boolean
    prompt: "Give the paragraph beginning “The People allege that the defendant committed the followin…”?"
  - { id: also, type: boolean, prompt: "Include “also”?" }
  - id: people_also_allege_that
    type: boolean
    prompt: "Include “The People [also] allege that the defendant committed the following o…”?"
  - id: alcoholic_beverage_2
    type: multi
    options: [ { id: o1, label: "an alcoholic beverage" }, { id: o2, label: "a drug" } ]
    prompt: "Which apply? (one or more)"
  - id: great_bodily_injury_means
    type: boolean
    prompt: "Include “Great bodily injury means significant or substantial physical injury.…”?"
  - id: person_facing_sudden_unexpected
    type: boolean
    prompt: "Include “A person facing a sudden and unexpected emergency situation not cause…”?"
  - id: act_causes_death_if
    type: boolean
    prompt: "Include “An act causes death if the death is the direct, natural, and probable…”?"
  - id: there_may_be_more
    type: boolean
    prompt: "Include “There may be more than one cause of death. An act causes death only i…”?"
  - id: misdemeanor_s_2
    type: multi
    options:
      - { id: o1, label: "misdemeanor[s]" }
      - { id: o2, label: "infraction[s]" }
      - { id: o3, label: "otherwise lawful act[s] that might cause death" }
    prompt: "Which apply? (one or more)"
  - id: misdemeanors
    type: multi
    options:
      - { id: o1, label: misdemeanors }
      - { id: o2, label: infractions }
      - { id: o3, label: "otherwise lawful acts that might cause death" }
    prompt: "Which apply? (one or more)"
  - id: people_allege_that_defendant_2
    type: boolean
    prompt: "Include “The People allege that the defendant committed the following (misdeme…”?"
  - id: people_have_burden_proving
    type: boolean
    prompt: "Include “The People have the burden of proving beyond a reasonable doubt that…”?"
  - id: misdemeanor_plural
    type: boolean
    prompt: "Include the “s” in “misdemeanor[s]”?"
  - { id: infraction_plural, type: boolean, prompt: "Include the “s” in “infraction[s]”?" }
  - id: instruction_plural
    type: boolean
    prompt: "Include the “s” in “Instruction[s]”?"
  - { id: tell_plural, type: boolean, prompt: "Include the “s” in “tell[s]”?" }
  - { id: act_plural, type: boolean, prompt: "Include the “s” in “act[s]”?" }
  - { id: crime_plural, type: boolean, prompt: "Include the “s” in “crime[s]”?" }
body:
  - - "The defendant is charged "
    - { opt: [ "in Count ", { field: count } ], if: in_count }
    - " with gross vehicular manslaughter while intoxicated "
    - opt: [ "in violation of Penal Code section 191.5", "(", a, ")" ]
      if: in_violation_penal_code
    - "."
  - [ "To prove that the defendant is guilty of this crime, the People must prove that:" ]
  - elements:
      - n: "1"
        text:
          - "The defendant "
          - choice: drove_under_influence_alcoholic
            options:
              - - "drove under the influence of "
                - any: alcoholic_beverage
                  options: [ [ "an alcoholic beverage" ], [ { sep: or }, " a drug" ] ]
                - " "
                - opt: [ "or under the combined influence of an alcoholic beverage and a drug" ]
                  if: under_combined_influence_alcoholic
              - [ "drove while having a blood alcohol level of 0.08 or higher" ]
              - - "drove under the influence of "
                - any: alcoholic_beverage
                  options: [ [ "an alcoholic beverage" ], [ { sep: or }, " a drug" ] ]
                - " "
                - opt: [ "or under the combined influence of an alcoholic beverage and a drug" ]
                  if: under_combined_influence_alcoholic
                - " when under the age of 21"
              - [ "drove while having a blood alcohol level of 0.05 or higher when under the age of 21" ]
        end: ";"
      - n: "2"
        text:
          - "While driving that vehicle under the influence of "
          - any: alcoholic_beverage
            options: [ [ "an alcoholic beverage" ], [ { sep: or }, " a drug" ] ]
          - " "
          - opt: [ "or under the combined influence of an alcoholic beverage and a drug" ]
            if: under_combined_influence_alcoholic
          - ", the defendant also committed "
          - { choice: a_or_an, options: [ [ a ], [ an ] ] }
          - " "
          - any: misdemeanor
            options:
              - [ misdemeanor, { sep: "," } ]
              - [ { sep: or }, " infraction", { sep: "," } ]
              - [ { sep: or }, " otherwise lawful act that might cause death" ]
        end: ";"
      - n: "3"
        text:
          - "The defendant committed the "
          - any: misdemeanor
            options:
              - [ misdemeanor, { sep: "," } ]
              - [ { sep: or }, " infraction", { sep: "," } ]
              - [ { sep: or }, " otherwise lawful act that might cause death" ]
          - " with gross negligence"
        end: ";"
      - n: "4"
        text: [ "The defendant’s grossly negligent conduct caused the death of another person" ]
        end: "."
        and: "AND"
  - opt:
      - - "The People allege that the defendant committed the following "
        - any: misdemeanor_s
          options:
            - [ misdemeanor, { opt: [ s ], if: misdemeanor_plural } ]
            - [ { sep: and }, " infraction", { opt: [ s ], if: infraction_plural } ]
        - ": "
        - { field: "text.misdemeanor_s_infraction_s", hint: "insert misdemeanor[s] /infraction[s]" }
        - "."
      - - "Instruction"
        - { opt: [ s ], if: instruction_plural }
        - " "
        - { field: "text.f3" }
        - " tell"
        - { opt: [ s ], if: tell_plural }
        - " you what the People must prove in order to prove that the defendant committed "
        - { field: "text.misdemeanor_s_infraction_s_2", hint: "insert misdemeanor[s]/infraction[s]" }
        - "."
    if: people_allege_that_defendant
  - - opt:
        - "The People "
        - { opt: [ also ], if: also }
        - " allege that the defendant committed the following otherwise lawful act"
        - "("
        - s
        - ")"
        - " that might cause death: "
        - { field: "text.act_s_alleged", hint: "insert act[s] alleged" }
        - "."
      if: people_also_allege_that
  - - "Instruction"
    - { opt: [ s ], if: instruction_plural }
    - " "
    - { field: "text.f6" }
    - " tell"
    - { opt: [ s ], if: tell_plural }
    - " you what the People must prove in order to prove that the defendant "
    - choice: drove_under_influence_alcoholic
      options:
        - - "drove under the influence of "
          - any: alcoholic_beverage
            options: [ [ "an alcoholic beverage" ], [ { sep: or }, " a drug" ] ]
          - " "
          - opt: [ "or under the combined influence of an alcoholic beverage and a drug" ]
            if: under_combined_influence_alcoholic
        - [ "drove while having a blood alcohol level of 0.08 or higher" ]
        - - "drove under the influence of "
          - any: alcoholic_beverage
            options: [ [ "an alcoholic beverage" ], [ { sep: or }, " a drug" ] ]
          - " "
          - opt: [ "or under the combined influence of an alcoholic beverage and a drug" ]
            if: under_combined_influence_alcoholic
          - " when under the age of 21"
        - [ "drove while having a blood alcohol level of 0.05 or higher when under the age of 21" ]
    - "."
  - - { em: "Gross negligence" }
    - " involves more than ordinary carelessness, inattention, or mistake in judgment. A person acts with gross negligence when:"
  - elements:
      - n: "1"
        text:
          - "He or she acts in a reckless way that creates a high risk of death or great bodily injury"
        end: ";"
      - n: "2"
        text: [ "A reasonable person would have known that acting in that way would create such a risk" ]
        end: "."
        and: "AND"
  - - "In other words, a person acts with gross negligence when the way he or she acts is so different from the way an ordinarily careful person would act in the same situation that his or her act amounts to disregard for human life or indifference to the consequences of that act."
  - - "The combination of driving a vehicle while under the influence of "
    - any: alcoholic_beverage_2
      options: [ [ "an alcoholic beverage" ], [ { sep: "and/or" }, " a drug" ] ]
    - " and violating a traffic law is not enough by itself to establish gross negligence. In evaluating whether the defendant acted with gross negligence, consider the level of the defendant’s intoxication, if any; the way the defendant drove; and any other relevant aspects of the defendant’s conduct."
  - - opt:
        - { em: "Great bodily injury" }
        - " means significant or substantial physical injury. It is an injury that is greater than moderate harm."
      if: great_bodily_injury_means
  - - opt:
        - "A person facing a sudden and unexpected emergency situation not caused by that person’s own negligence is required only to use the same care and judgment that an ordinarily careful person would use in the same situation, even if it appears later that a different course of action would have been safer."
      if: person_facing_sudden_unexpected
  - - opt:
        - "An act causes death if the death is the direct, natural, and probable consequence of the act and the death would not have happened without the act. A "
        - { em: "natural and probable consequence" }
        - " is one that a reasonable person would know is likely to happen if nothing unusual intervenes. In deciding whether a consequence is natural and probable, consider all of the circumstances established by the evidence."
      if: act_causes_death_if
  - - opt:
        - "There may be more than one cause of death. An act causes death only if it is a substantial factor in causing the death. A "
        - { em: "substantial factor" }
        - " is more than a trivial or remote factor. However, it does not need to be the only factor that causes the death."
      if: there_may_be_more
  - - opt:
        - "The People allege that the defendant committed the following "
        - any: misdemeanor_s_2
          options:
            - [ misdemeanor, { opt: [ s ], if: misdemeanor_plural }, { sep: "," } ]
            - [ { sep: and }, " infraction", { opt: [ s ], if: infraction_plural }, { sep: "," } ]
            - - { sep: and }
              - " otherwise lawful act"
              - { opt: [ s ], if: act_plural }
              - " that might cause death"
        - ": "
        - field: "text.alleged_predicate_acts_when"
          hint: "insert alleged predicate acts when multiple acts alleged"
        - ". You may not find the defendant guilty unless all of you agree that the People have proved that the defendant committed at least one of these alleged "
        - any: misdemeanors
          options:
            - [ misdemeanors, { sep: "," } ]
            - [ { sep: or }, " infractions", { sep: "," } ]
            - [ { sep: or }, " otherwise lawful acts that might cause death" ]
        - " and you all agree on which "
        - any: misdemeanor
          options:
            - [ misdemeanor, { sep: "," } ]
            - [ { sep: or }, " infraction", { sep: "," } ]
            - [ { sep: or }, " otherwise lawful act that might cause death" ]
        - " the defendant committed."
      if: people_allege_that_defendant_2
  - - opt:
        - "The People have the burden of proving beyond a reasonable doubt that the defendant committed gross vehicular manslaughter while intoxicated. If the People have not met this burden, you must find the defendant not guilty of that crime. You must consider whether the defendant is guilty of the lesser crime"
        - { opt: [ s ], if: crime_plural }
        - " of "
        - { field: "text.lesser_offense_s", hint: "insert lesser offense[s]" }
        - "."
      if: people_have_burden_proving
