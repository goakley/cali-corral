questions: []
body:
  - - "If the defendant failed in "
    - { pronoun: defendant, forms: [ his, her ] }
    - " testimony to explain or deny evidence against "
    - { pronoun: defendant, forms: [ him, her ] }
    - ", and if "
    - { pronoun: defendant, forms: [ he, she ] }
    - " could reasonably be expected to have done so based on what "
    - { pronoun: defendant, forms: [ he, she ] }
    - " knew, you may consider "
    - { pronoun: defendant, forms: [ his, her ] }
    - " failure to explain or deny in evaluating that evidence. Any such failure is not enough by itself to prove guilt. The People must still prove the defendant guilty beyond a reasonable doubt."
  - - "If the defendant failed to explain or deny, it is up to you to decide the meaning and importance of that failure."
