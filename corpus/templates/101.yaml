# CALCRIM No. 101. Instruction text: Judicial Council of California, freely
# reproducible under Cal. Rules of Court, rule 2.1050(c). Template structure: CC0.
schema: 1
id: "101"
title: "Cautionary Admonitions: Jury Conduct (Before, During, or After Jury Is Selected)"
source:
  file: "calcrim-2026"
  release: "2026-10"
  revision_line: "New January 2006; Revised June 2007, April 2008, December 2008, April 2010, October 2010, April 2011, February 2012, August 2012, August 2014, September 2019, April 2020, September 2023"
  body_sha256: "89c1a731e96c53c503afcb0d7e86f54577ebcff2d168d04b3fca1391395cac45"
review: "machine-checked"
questions:
  - id: unless_i_tell_you
    type: boolean
    prompt: "Include “unless I tell you otherwise”?"
  - id: research_sources
    type: multi
    prompt: "Sources jurors must not use, besides the Internet"
    options:
      - { id: dictionary, label: "a dictionary" }
      - { id: other, label: "another source of information or means of communication" }
  - id: if_you_have_cell
    type: boolean
    prompt: "Include “If you have a cell phone or other electronic device, keep it turned o…”?"
  - id: ses_bias
    type: boolean
    prompt: "Include socioeconomic status in the list of biases?"
  - { id: other_bias, type: boolean, prompt: "Add another impermissible form of bias?" }
  - id: if_you_violate_this
    type: boolean
    prompt: "Include “If you violate this rule, you may be subject to jail time, a fine, or…”?"
  - id: but_under_california_law
    type: boolean
    prompt: "Include “But under California law, you must wait at least 90 days before negot…”?"
body:
  - - "Our system of justice requires that trials be conducted in open court with the parties presenting evidence and the judge deciding the law that applies to the case. It is unfair to the parties if you receive additional information from any other source because that information may be unreliable or irrelevant and the parties will not have had the opportunity to examine and respond to it. Your verdict must be based only on the evidence presented during trial in this court and the law as I provide it to you."
  - - "During the trial, do not talk about the case or about any of the people or any subject involved in the case with anyone, not even your family, friends, spiritual advisors, or therapists. You may only say that you are on a jury and the anticipated length of the trial, and you may inform others of scheduling and emergency contact information. Do not share any information about the case by any means of communication, including in writing, by email, by telephone, on the Internet, social media, Internet chat rooms, and blogs. You must not talk about these things with other jurors either, until you begin deliberating."
  - - "As jurors, you may discuss the case together only after all of the evidence has been presented, the attorneys have completed their arguments, and I have instructed you on the law. After I tell you to begin your deliberations, you may discuss the case only in the jury room, and only when all jurors are present."
  - - "You must not allow anything that happens outside of the courtroom to affect your decision "
    - { opt: [ "unless I tell you otherwise" ], if: unless_i_tell_you }
    - ". During the trial, do not read, listen to, or watch any news report or commentary about the case from any source."
  - - "Do not use the Internet "
    - any: research_sources
      options:
        - [ ", a dictionary" ]
        - - opt:
              - ", or "
              - field: "text.other_source"
                hint: "insert other relevant source of information or means of communication"
            if: "research_sources~other"
    - " in any way in connection with this case, either on your own or as a group. Do not investigate the facts or the law or do any research regarding this case or any of its participants. Do not conduct any tests or experiments, or visit the scene of any event involved in this case. If you happen to pass by the scene, do not stop or investigate."
  - - opt:
        - "If you have a cell phone or other electronic device, keep it turned off while you are in the courtroom and during jury deliberations. An electronic device includes any data storage device. If someone needs to contact you in an emergency, the court can receive messages that it will deliver to you without delay."
      if: if_you_have_cell
  - - "During the trial, do not speak to a defendant, witness, lawyer, or anyone associated with them. Do not listen to anyone who tries to talk to you about the case or about any of the people or subjects involved in it. If someone asks you about the case, tell him or her that you cannot discuss it. If that person keeps talking to you about the case, you must end the conversation."
  - - "If you receive any information about this case from any source outside of the trial, even unintentionally, do not share that information with any other juror. If you do receive such information, or if anyone tries to influence you or any juror, you must immediately tell the bailiff."
  - - "Keep an open mind throughout the trial. Do not make up your mind about the verdict or any issue until after you have discussed the case with the other jurors during deliberations. Do not take anything I say or do during the trial as an indication of what I think about the facts, the witnesses, or what your verdict should be."
  - - "You must not let bias, sympathy, prejudice, or public opinion influence your assessment of the evidence or your decision. Bias can affect what we notice and pay attention to, what we see and hear, what we remember, how we perceive people, and how we make decisions. We may favor or be more likely to believe people whom we see as similar to us or with whom we identify. Conversely, we may disfavor or be less likely to believe people whom we see as different."
  - - "Although we are aware of some of our biases, we may not be aware of all of them. We refer to those biases as “implicit” or “unconscious.” They may be based on stereotypes we would reject if they were brought to our attention. Implicit or unconscious biases can affect how we perceive others and how we make decisions, without our being aware of their effect."
  - - "You must not be biased in favor of or against any party, witness, attorney, defendant"
    - { opt: [ s ], if: "@multiple_defendants" }
    - ", or alleged victim because of his or her disability, gender, nationality, national origin, race or ethnicity, religion, gender identity, sexual orientation, "
    - { opt: [ or ], if: "!ses_bias & !other_bias" }
    - " age "
    - { when: [ "!ses_bias & !other_bias", "ses_bias | other_bias" ], options: [ ".", "," ] }
    - " "
    - { opt: [ "or socioeconomic status" ], if: ses_bias }
    - " "
    - { when: [ "ses_bias & !other_bias", "ses_bias & other_bias" ], options: [ ".", "," ] }
    - " "
    - opt:
        - "or "
        - { field: "text.other_bias", hint: "insert any other impermissible form of bias" }
        - "."
      if: other_bias
  - [ "You must reach your verdict without any consideration of punishment." ]
  - - "I want to emphasize that you may not use any form of research or communication, including electronic or wireless research or communication, to research, share, communicate, or allow someone else to communicate with you regarding any subject of the trial. "
    - opt:
        - "If you violate this rule, you may be subject to jail time, a fine, or other punishment."
      if: if_you_violate_this
  - - "When the trial has ended and you have been released as jurors, you may discuss the case with anyone. "
    - opt:
        - "But under California law, you must wait at least 90 days before negotiating or agreeing to accept any payment for information about the case."
      if: but_under_california_law
