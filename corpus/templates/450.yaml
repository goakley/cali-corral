# CALCRIM No. 450. Instruction text: Judicial Council of California, freely
# reproducible under Cal. Rules of Court, rule 2.1050(c). Template structure: CC0.
schema: 1
id: "450"
title: "Liability of Corporate Officers and Agents: Single Theory of Liability"
source:
  file: "calcrim-2026"
  release: "2026-10"
  revision_line: "New January 2006; Revised February 2012"
  body_sha256: edd455c7e579e0d08421d797443b037fa32a600ab4dd4f32d8559627c853b844
review: "machine-checked"
questions:
  - { id: in_count, type: boolean, prompt: "Include “in Count ___”?" }
  - id: officer
    type: multi
    options: [ { id: o1, label: officer }, { id: o2, label: agent } ]
    prompt: "Which apply? (one or more)"
  - id: personally_committed_was_direct
    type: choice
    options:
      - { id: o1, label: "personally committed" }
      - { id: o2, label: "was a direct participant in" }
    prompt: "Choose one"
  - id: prove_that_defendant_personally
    type: boolean
    prompt: "Include “To prove that the defendant personally committed the crime charged, t…”?"
  - id: failed_authorized_caused_permitted
    type: choice
    options:
      - { id: o1, label: "failed to" }
      - { id: o2, label: authorized }
      - { id: o3, label: caused }
      - { id: o4, label: permitted }
    prompt: "Choose one"
  - id: prove_that_defendant_was
    type: boolean
    prompt: "Give the paragraph beginning “To prove that the defendant was a direct participant in the…”?"
  - id: element_3
    type: boolean
    prompt: "Include element 3 (“The defendant knew ___”)?"
  - id: element_3_2
    type: boolean
    prompt: "Include element 3 (“When the defendant acted, (he/she) intended to ___”)?"
body:
  - - "The defendant is charged "
    - { opt: [ "in Count ", { field: count } ], if: in_count }
    - " with "
    - { field: "text.offense_charged", hint: "insert offense charged" }
    - " while acting as an "
    - { any: officer, options: [ [ officer ], [ { sep: or }, " agent" ] ] }
    - " of a corporation."
  - - "The People must prove that the defendant "
    - choice: personally_committed_was_direct
      options: [ [ "personally committed" ], [ "was a direct participant in" ] ]
    - " the crime charged. The fact that the defendant is an "
    - { any: officer, options: [ [ officer ], [ { sep: or }, " agent" ] ] }
    - " of the corporation is not sufficient by itself to support a finding of guilt."
  - note: "Alternative A—prosecution alleges only that defendant committed prohibited act personally"
  - - opt:
        - "To prove that the defendant personally committed the crime charged, the People must prove that the defendant "
        - field: "text.description_conduct_alleged_in"
          hint: "insert description of conduct alleged in offense"
        - "."
      if: prove_that_defendant_personally
  - note: "Alternative B—prosecution alleges only that defendant had authority to control conduct of others"
    governs: [ prove_that_defendant_was ]
  - opt:
      - - "To prove that the defendant was a direct participant in the crime charged, the People must prove that:"
      - elements:
          - n: "1"
            text:
              - "The defendant had the authority to control "
              - field: "text.description_conduct_alleged_in"
                hint: "insert description of conduct alleged in offense"
            end: ";"
          - n: "2"
            text:
              - "The defendant "
              - choice: failed_authorized_caused_permitted
                options: [ [ "failed to" ], [ authorized ], [ caused ], [ permitted ] ]
              - " "
              - field: "text.description_conduct_alleged_in"
                hint: "insert description of conduct alleged in offense"
            end: "(;/.)"
            and: "[AND]"
    if: prove_that_defendant_was
  - note: "Alternative 3A: Give if offense alleged requires only knowledge or general criminal intent."
  - elements:
      - n: "3"
        text:
          - "The defendant knew "
          - field: "text.description_knowledge_about_conduct"
            hint: "insert description of knowledge about conduct alleged in offense"
        end: "(;/.)"
        and: "AND"
        if: element_3
      - note: "Alternative 3B: Give if offense alleged requires specific intent."
        governs: [ element_3_2 ]
      - n: "3"
        text:
          - "When the defendant acted, "
          - { pronoun: defendant, forms: [ he, she ] }
          - " intended to "
          - field: "text.description_specific_intent_required"
            hint: "insert description of specific intent required"
        end: "."
        and: "AND"
        if: element_3_2
