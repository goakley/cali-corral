questions:
  - id: out_court_before_trial
    type: choice
    options: [ { id: o1, label: "out of court" }, { id: o2, label: "before trial" } ]
    prompt: "Choose one"
body:
  - - "You have heard evidence that defendant "
    - { field: "defendant.name", hint: "insert defendant’s name" }
    - " made a statement "
    - { choice: out_court_before_trial, options: [ [ "out of court" ], [ "before trial" ] ] }
    - ". You may consider that evidence only against "
    - { pronoun: defendant, forms: [ him, her ] }
    - ", not against any other defendant."
