# CALCRIM No. 200. Instruction text: Judicial Council of California, freely
# reproducible under Cal. Rules of Court, rule 2.1050(c). Template structure: CC0.
schema: 1
id: "200"
title: "Duties of Judge and Jury"
source:
  file: calcrim-2026
  release: "2026-10"
  revision_line: "New January 2006; Revised June 2007, April 2008, December 2008, September 2019, April 2020"
  body_sha256: "362cb042f9df8f79dbf6346a9e0c04a1685b973e42674c648c7833aca9d65cce"
review: machine-checked
questions:
  - { id: copy_will_give, type: boolean, prompt: "Say “I will give you a copy of the instructions to use in the jury room”?" }
  - { id: copy_each_has, type: boolean, prompt: "Say “Each of you has a copy of these instructions to use in the jury room”?" }
  - { id: handwritten, type: boolean, prompt: "Include the paragraph on printed, typed or handwritten instructions?" }
  - { id: ses_bias, type: boolean, prompt: "Include socioeconomic status in the list of biases?" }
  - { id: other_bias, type: boolean, prompt: "Add another impermissible form of bias?" }
  - { id: no_inference, type: boolean, prompt: "Include “Do not assume just because I give a particular instruction…”?" }
body:
  - - "Members of the jury, I will now instruct you on the law that applies to this case. "
    - { opt: "I will give you a copy of the instructions to use in the jury room.", if: copy_will_give }
    - " "
    - { opt: "Each of you has a copy of these instructions to use in the jury room.", if: copy_each_has }
    - " "
    - opt: "The instructions that you receive may be printed, typed, or written by hand. Certain sections may have been crossed-out or added. Disregard any deleted sections and do not try to guess what they might have been. Only consider the final version of the instructions in your deliberations."
      if: handwritten
  - "You must decide what the facts are. It is up to all of you, and you alone, to decide what happened, based only on the evidence that has been presented to you in this trial."
  - - "You must not let bias, sympathy, prejudice, or public opinion influence your assessment of the evidence or your decision. Many people have assumptions and biases about or stereotypes of other people and may be unaware of them. You must not be biased in favor of or against any party, witness, attorney, defendant"
    - { opt: "s", if: "@multiple_defendants" }
    - ", or alleged victim because of his or her disability, gender, nationality, national origin, race or ethnicity, religion, gender identity, sexual orientation, "
    - { opt: "or", if: "!ses_bias & !other_bias" }
    - " age "
    - { when: ["!ses_bias & !other_bias", "ses_bias | other_bias"], options: [".", ","] }
    - " "
    - { opt: "or socioeconomic status", if: ses_bias }
    - " "
    - { when: ["ses_bias & !other_bias", "ses_bias & other_bias"], options: [".", ","] }
    - " "
    - { opt: ["or ", { field: text.other_bias, hint: "insert any other impermissible form of bias" }, "."], if: other_bias }
  - "You must follow the law as I explain it to you, even if you disagree with it. If you believe that the attorneys’ comments on the law conflict with my instructions, you must follow my instructions."
  - "Pay careful attention to all of these instructions and consider them together. If I repeat any instruction or idea, do not conclude that it is more important than any other instruction or idea just because I repeated it."
  - "Some words or phrases used during this trial have legal meanings that are different from their meanings in everyday use. These words and phrases will be specifically defined in these instructions. Please be sure to listen carefully and follow the definitions that I give you. Words and phrases not specifically defined in these instructions are to be applied using their ordinary, everyday meanings."
  - - "Some of these instructions may not apply, depending on your findings about the facts of the case. "
    - { opt: "Do not assume just because I give a particular instruction that I am suggesting anything about the facts.", if: no_inference }
    - " After you have decided what the facts are, follow the instructions that do apply to the facts as you find them."
