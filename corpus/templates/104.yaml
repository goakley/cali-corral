schema: 1
id: "104"
title: "Evidence"
source:
  file: "calcrim-2026"
  release: "2026-10"
  revision_line: "New January 2006; Revised April 2008, August 2009, March 2019"
  body_sha256: "87a26b0883bc5096a053da5a0c3c325767fa69108b598c079db4d27519fb8f2a"
review: "machine-checked"
questions:
  - { id: during_jury_view, type: boolean, prompt: "Include “or during a jury view”?" }
  - { id: reporter, type: boolean, prompt: "Include “reporter”?" }
  - id: record_recording
    type: choice
    options: [ { id: o1, label: record }, { id: o2, label: recording } ]
    prompt: "Choose one"
body:
  - - "You must decide what the facts are in this case. You must use only the evidence that is presented in the courtroom "
    - { opt: [ "or during a jury view" ], if: during_jury_view }
    - ". “Evidence” is the sworn testimony of witnesses, the exhibits admitted into evidence, and anything else I tell you to consider as evidence. The fact that the defendant was arrested, charged with a crime, or brought to trial is not evidence of guilt."
  - - "Nothing that the attorneys say is evidence. In their opening statements and closing arguments, the attorneys will discuss the case, but their remarks are not evidence. Their questions are not evidence. Only the witnesses’ answers are evidence. The attorneys’ questions are significant only if they help you understand the witnesses’ answers. Do not assume that something is true just because one of the attorneys asks a question that suggests it is true."
  - - "During the trial, the attorneys may object to questions asked of a witness. I will rule on the objections according to the law. If I sustain an objection, the witness will not be permitted to answer, and you must ignore the question. If the witness does not answer, do not guess what the answer might have been or why I ruled as I did. If I order testimony stricken from the record, you must disregard it and must not consider that testimony for any purpose."
  - - "You must disregard anything you see or hear when the court is not in session, even if it is done or said by one of the parties or witnesses."
  - - "The court "
    - { opt: [ reporter ], if: reporter }
    - " has made a "
    - { choice: record_recording, options: [ [ record ], [ recording ] ] }
    - " of everything that was said during the trial. If you decide that it is necessary, you may ask that the "
    - choice: record_recording
      options: [ [ "court reporter’s record be read to" ], [ "court’s recording be played for" ] ]
    - " you. You must accept the "
    - choice: record_recording
      options: [ [ "court reporter’s record" ], [ "court’s recording" ] ]
    - " as accurate."
