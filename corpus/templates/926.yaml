# CALCRIM No. 926. Instruction text: Judicial Council of California, freely
# reproducible under Cal. Rules of Court, rule 2.1050(c). Template structure: CC0.
schema: 1
id: "926"
title: "Battery Against Specified Victim Not a Peace Officer (Pen. Code, §§ 242, 243(b)–(c)(1))"
source:
  file: calcrim-2026
  release: "2026-10"
  revision_line: "New January 2006; Revised February 2025"
  body_sha256: "9b0d78c18567294418d0a412d916a8fbc718d7d695aee4b27d1d0e5caf2f8de8"
review: machine-checked
people:
  victim: { label: "Person touched", uses: [name, title] }
related:
  - { id: "3470", reason: "Self-defense instructions when the self-defense element is given." }
questions:
  - { id: count_ref, type: boolean, prompt: "Name the count?" }
  - { id: cite_statute, type: boolean, prompt: "Cite Penal Code section 243?" }
  - id: title_article
    type: choice
    prompt: "Article before the victim's title"
    articleFor: victim.title
    options: [{ id: a, label: "a" }, { id: an, label: "an" }]
  - { id: unlawfully, type: boolean, prompt: "Include “and unlawfully” in element 1?" }
  - id: victim_alt
    type: choice
    prompt: "Element 2 alternative"
    options:
      - { id: duties, label: "2A — specified person performing duties" }
      - { id: medical, label: "2B — nurse or doctor" }
  - id: medical_kind
    type: choice
    prompt: "The victim was a…"
    options: [{ id: nurse, label: "nurse" }, { id: doctor, label: "medical doctor" }]
  - { id: injury, type: boolean, prompt: "Is the defendant charged with Pen. Code, § 243(c)(1) (injury element)?" }
  - { id: self_defense, type: boolean, prompt: "Instructing on self-defense or defense of another?" }
  - id: defense_kind
    type: multi
    prompt: "Which defenses?"
    options: [{ id: self, label: "self-defense" }, { id: other, label: "defense of someone else" }]
  - { id: duties_def, type: boolean, prompt: "List the victim's duties?" }
  - { id: on_duty, type: boolean, prompt: "Give the “actually on duty” paragraph?" }
  - { id: injury_def, type: boolean, prompt: "Give the definition of injury?" }
  - { id: indirect, type: boolean, prompt: "Give the indirect-touching paragraph?" }
  - id: indirect_how
    type: multi
    prompt: "How was the touching indirect?"
    options:
      - { id: object, label: "by causing an object [or someone else] to touch the other person" }
      - { id: held, label: "by touching something held by or attached to the other person" }
  - { id: indirect_someone_else, type: boolean, prompt: "Include “or someone else”?" }
body:
  - - "The defendant is charged "
    - { opt: ["in Count ", { field: count }], if: count_ref }
    - " with battery against "
    - { choice: title_article, options: ["a", "an"] }
    - " "
    - { field: victim.title, hint: "insert title specified in Pen. Code, § 243(c)(1)" }
    - " "
    - { opt: "in violation of Penal Code section 243", if: cite_statute }
    - "."
  - "To prove that the defendant is guilty of this charge, the People must prove that:"
  - elements:
      - n: "1"
        text:
          - "The defendant willfully "
          - { opt: "and unlawfully", if: unlawfully }
          - " touched "
          - { field: victim.name, hint: "insert name" }
          - " in a harmful or offensive manner"
        end: ";"
      - alt: victim_alt
        options:
          - note: "Alternative 2A—specified person performing duties"
            elements:
              - n: "2"
                text:
                  - "When the defendant acted, "
                  - { field: victim.name, hint: "insert name" }
                  - " was a "
                  - { field: victim.title, hint: "insert title specified in Pen. Code, § 243(c)(1)" }
                  - " and was performing the duties of "
                  - { choice: title_article, options: ["a", "an"] }
                  - " "
                  - { field: victim.title, hint: "insert title specified in Pen. Code, § 243(c)(1)" }
                end: ";"
          - note: "Alternative 2B—nurse or doctor"
            elements:
              - n: "2"
                text:
                  - "When the defendant used that force, "
                  - { field: victim.name, hint: "insert name" }
                  - " was a "
                  - { choice: medical_kind, options: ["nurse", "medical doctor"] }
                  - " who was giving emergency medical care outside of a hospital, clinic, or other health care facility"
                end: ";"
      - n: "3"
        and: "[AND]"
        text:
          - "When the defendant acted, "
          - { pronoun: defendant, forms: [he, she] }
          - " knew or reasonably should have known, that "
          - { field: victim.name, hint: "insert name" }
          - " was "
          - { choice: title_article, options: ["a", "an"] }
          - " "
          - { field: victim.title, hint: "insert title specified in Pen. Code, § 243(c)(1)" }
          - " who was performing "
          - { pronoun: victim, forms: [his, her] }
          - " duties"
        end: "(;/.)"
      - { note: "Give element 4 when the defendant is charged with Pen. Code, § 243(c)(1).", governs: [injury] }
      - n: "4"
        if: injury
        and: "AND"
        text:
          - { field: victim.name, hint: "insert name" }
          - " suffered injury as a result of the force used"
        end: "(;/.)"
      - { note: "Give element 5 when instructing on self-defense or defense of another.", governs: [self_defense] }
      - n: "(4/5)"
        if: self_defense
        and: "AND"
        text:
          - "The defendant did not act "
          - { any: defense_kind, options: ["in self-defense", [{ sep: "or" }, " in defense of someone else"]] }
        end: "."
  - - "Someone commits an act "
    - { em: "willfully" }
    - " when he or she does it willingly or on purpose. It is not required that he or she intend to break the law, hurt someone else, or gain any advantage."
  - "Making contact with another person, including through his or her clothing, is enough to commit a battery."
  - opt:
      - - "The duties of "
        - { choice: title_article, options: ["a", "an"] }
        - " "
        - { field: victim.title, hint: "insert title specified in Pen. Code, § 243(c)(1)" }
        - " include "
        - { field: text.duties, hint: "insert appropriate list of job duties from statutory definition of professions, if available" }
        - "."
    if: duties_def
  - opt:
      - - "It does not matter whether "
        - { field: victim.name, hint: "insert name" }
        - " was actually on duty at the time."
    if: on_duty
  - opt:
      - - "An "
        - { em: "injury" }
        - " is any physical injury that requires professional medical treatment. The question whether an injury requires such treatment cannot be answered simply by deciding whether or not a person sought or received treatment. You may consider those facts, but you must decide this question based on the nature, extent, and seriousness of the injury itself."
    if: injury_def
  - opt:
      - - "The touching can be done indirectly "
        - any: indirect_how
          options:
            - ["by causing an object ", { opt: "or someone else", if: indirect_someone_else }, " to touch the other person"]
            - [{ sep: "or" }, " by touching something held by or attached to the other person"]
        - "."
    if: indirect
