# CALCRIM No. 332. Instruction text: Judicial Council of California, freely
# reproducible under Cal. Rules of Court, rule 2.1050(c). Template structure: CC0.
schema: 1
id: "332"
title: "Expert Witness Testimony"
source:
  file: "calcrim-2026"
  release: "2026-10"
  revision_line: "New January 2006; Revised March 2018"
  body_sha256: b6894488e2fb12601f380c5220a81fbc7bdb3807004e57a2f074c71470a95d22
review: "machine-checked"
questions:
  - id: witness_was_witnesses_were
    type: choice
    options: [ { id: o1, label: "A witness was" }, { id: o2, label: "Witnesses were" } ]
    prompt: "Choose one"
  - { id: an, type: boolean, prompt: "Include “an”?" }
  - { id: an_2, type: boolean, prompt: "Include “an”?" }
  - id: expert_witness_may_be
    type: boolean
    prompt: "Include “An expert witness may be asked a hypothetical question. A hypothetica…”?"
  - id: if_expert_witnesses_disagreed
    type: boolean
    prompt: "Include “If the expert witnesses disagreed with one another, you should weigh…”?"
  - { id: expert_plural, type: boolean, prompt: "More than one expert?" }
  - { id: opinion_plural, type: boolean, prompt: "More than one opinion?" }
body:
  - - { choice: witness_was_witnesses_were, options: [ [ "A witness was" ], [ "Witnesses were" ] ] }
    - " allowed to testify as "
    - { opt: [ an ], if: an }
    - " expert"
    - { opt: [ s ], if: expert_plural }
    - " and to give "
    - { opt: [ an ], if: an_2 }
    - " opinion"
    - { opt: [ s ], if: opinion_plural }
    - ". You must consider the opinion"
    - { opt: [ s ], if: opinion_plural }
    - ", but you are not required to accept "
    - { when: [ "!opinion_plural", opinion_plural ], options: [ it, them ] }
    - " as true or correct. The meaning and importance of any opinion are for you to decide. In evaluating the believability of an expert witness, follow the instructions about the believability of witnesses generally. In addition, consider the expert’s knowledge, skill, experience, training, and education, the reasons the expert gave for any opinion, and the facts or information on which the expert relied in reaching that opinion. You must decide whether information on which the expert relied was true and accurate."
  - - "You may disregard any opinion that you find unbelievable, unreasonable, or unsupported by the evidence."
  - - opt:
        - "An expert witness may be asked a hypothetical question. A "
        - { em: "hypothetical question" }
        - " asks the witness to assume certain facts are true and to give an opinion based on the assumed facts. It is up to you to decide whether an assumed fact has been proved. If you conclude that an assumed fact is not true, consider the effect of the expert’s reliance on that fact in evaluating the expert’s opinion."
      if: expert_witness_may_be
  - - opt:
        - "If the expert witnesses disagreed with one another, you should weigh each opinion against the others. You should examine the reasons given for each opinion and the facts or other matters on which each witness relied. You may also compare the experts’ qualifications."
      if: if_expert_witnesses_disagreed
