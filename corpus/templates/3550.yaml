# CALCRIM No. 3550. Instruction text: Judicial Council of California, freely
# reproducible under Cal. Rules of Court, rule 2.1050(c). Template structure: CC0.
schema: 1
id: "3550"
title: "Pre-Deliberation Instructions"
source:
  file: calcrim-2026
  release: "2026-10"
  revision_line: "New January 2006; Revised April 2008, October 2010, April 2011, September 2018"
  body_sha256: "78afed42727f88dacac482aa89e0ccfbe8b2aafa11817b1cedac3cd2aced473a"
review: machine-checked
questions:
  - id: research_sources
    type: multi
    prompt: "Sources jurors must not use, besides the Internet"
    options:
      - { id: dictionary, label: "a dictionary" }
      - { id: other, label: "another relevant source of information" }
  - { id: exhibits, type: boolean, prompt: "Give the paragraph about exhibits?" }
  - id: exhibits_how
    type: choice
    prompt: "How will jurors see exhibits?"
    options:
      - { id: sent, label: "Exhibits will be sent into the jury room" }
      - { id: request, label: "Jurors must request exhibits in writing" }
  - id: vote_on
    type: multi
    prompt: "Do not reveal how the vote stands on…"
    options: [{ id: guilt, label: "the question of guilt" }, { id: issues, label: "issues in this case" }]
  - { id: each_count, type: boolean, prompt: "Say “on each count and any special findings”?" }
  - { id: coin_flip, type: boolean, prompt: "Include “Do not reach a decision by the flip of a coin…”?" }
  - { id: retrial, type: boolean, prompt: "Give the retrial paragraph?" }
  - { id: retrial_charges_plural, type: boolean, prompt: "More than one charge in the retrial paragraph?" }
  - { id: retrial_counts, type: boolean, prompt: "Name the count(s) in the retrial paragraph?" }
  - { id: no_indication, type: boolean, prompt: "Include “Do not take anything I said or did during the trial as an indication…”?" }
  - { id: forms_plural, type: boolean, prompt: "More than one verdict form?" }
  - { id: partial_verdict, type: boolean, prompt: "Include the paragraph on reaching a decision on only some charges or defendants?" }
  - id: partial_on
    type: multi
    prompt: "Partial verdict on some…"
    options: [{ id: charges, label: "charges" }, { id: defendants, label: "defendants" }]
body:
  - "When you go to the jury room, the first thing you should do is choose a foreperson. The foreperson should see to it that your discussions are carried on in an organized way and that everyone has a fair chance to be heard."
  - "It is your duty to talk with one another and to deliberate in the jury room. You should try to agree on a verdict if you can. Each of you must decide the case for yourself, but only after you have discussed the evidence with the other jurors. Do not hesitate to change your mind if you become convinced that you are wrong. But do not change your mind just because other jurors disagree with you."
  - "Keep an open mind and openly exchange your thoughts and ideas about this case. Stating your opinions too strongly at the beginning or immediately announcing how you plan to vote may interfere with an open discussion. Please treat one another courteously. Your role is to be an impartial judge of the facts, not to act as an advocate for one side or the other."
  - - "As I told you at the beginning of the trial, do not talk about the case or about any of the people or any subject involved in it with anyone, including, but not limited to, your spouse or other family, or friends, spiritual leaders or advisors, or therapists. You must discuss the case only in the jury room and only when all jurors are present. Do not discuss your deliberations with anyone. Do not communicate using: "
    - { field: text.social_media, hint: "insert currently popular social media" }
    - " during your deliberations."
  - - "It is very important that you not use the Internet "
    - any: research_sources
      options:
        - ", a dictionary"
        - [{ opt: [", or ", { field: text.other_source, hint: "insert other relevant source of information" }], if: "research_sources~other" }]
    - " in any way in connection with this case during your deliberations."
  - opt:
      - - "During the trial, several items were received into evidence as exhibits. You may examine whatever exhibits you think will help you in your deliberations. "
        - choice: exhibits_how
          options:
            - "These exhibits will be sent into the jury room with you when you begin to deliberate."
            - "If you wish to see any exhibits, please request them in writing."
    if: exhibits
  - "If you need to communicate with me while you are deliberating, send a note through the bailiff, signed by the foreperson or by one or more members of the jury. To have a complete record of this trial, it is important that you not communicate with me except by a written note. If you have questions, I will talk with the attorneys before I answer so it may take some time. You should continue your deliberations while you wait for my answer. I will answer any questions in writing or orally here in open court."
  - - "Do not reveal to me or anyone else how the vote stands on the "
    - { any: vote_on, options: ["question of guilt", [{ sep: "or" }, " issues in this case"]] }
    - " unless I ask you to do so."
  - - "Your verdict "
    - { opt: "on each count and any special findings", if: each_count }
    - " must be unanimous. This means that, to return a verdict, all of you must agree to it. "
    - { opt: "Do not reach a decision by the flip of a coin or by any similar act.", if: coin_flip }
  - { note: "During a retrial, give the following paragraph on request to inform jury about prior proceedings without introducing extraneous matters", governs: [retrial] }
  - opt:
      - - "Sometimes issues are tried in separate trials. The only issue in this trial is whether the People have proved the charge"
        - { opt: "s", if: retrial_charges_plural }
        - " of "
        - { field: text.retrial_charges, hint: "insert description of charge[s]" }
        - " "
        - opt: ["in Count", { opt: "s", if: retrial_charges_plural }, " ", { field: text.retrial_count_numbers }]
          if: retrial_counts
        - ". Do not speculate about whether the defendant was already found guilty for "
        - { pronoun: defendant, forms: [his, her] }
        - " conduct or may be found guilty in the future in another trial. Do not consider any potential punishment."
    if: retrial
  - - "It is not my role to tell you what your verdict should be. "
    - { opt: "Do not take anything I said or did during the trial as an indication of what I think about the facts, the witnesses, or what your verdict should be.", if: no_indication }
  - "You must reach your verdict without any consideration of punishment."
  - - "You will be given "
    - { opt: "a", if: "!forms_plural" }
    - " verdict form"
    - { opt: "s", if: forms_plural }
    - ". As soon as all jurors have agreed on a verdict, the foreperson must date and sign the appropriate verdict form"
    - { opt: "s", if: forms_plural }
    - " and notify the bailiff. "
    - opt:
        - "If you are able to reach a unanimous decision on only one or only some of the "
        - { any: partial_on, options: ["charges", [{ sep: "or" }, " defendants"]] }
        - ", fill in "
        - { when: ["!forms_plural", forms_plural], options: ["that", "those"] }
        - " verdict form"
        - { opt: "s", if: forms_plural }
        - " only, and notify the bailiff."
      if: partial_verdict
    - " Return any unsigned verdict form."
