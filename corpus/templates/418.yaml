# CALCRIM No. 418. Instruction text: Judicial Council of California, freely
# reproducible under Cal. Rules of Court, rule 2.1050(c). Template structure: CC0.
schema: 1
id: "418"
title: "Coconspirator’s Statements"
source:
  file: "calcrim-2026"
  release: "2026-10"
  revision_line: "New January 2006; Revised August 2016, March 2023"
  body_sha256: e857c406c4a3f56daca4226eb6f69657ef5c1808e8db9db9d9ace7d5a1ed5ca4
review: "machine-checked"
questions:
  - id: defendant_s_defendant_s
    type: choice
    options: [ { id: o1, label: "the defendant[s]" }, { id: o2, label: "Defendant[s] ___" } ]
    prompt: "Choose one"
  - { id: any, type: boolean, prompt: "Include “any of”?" }
  - id: was_were
    type: choice
    options: [ { id: o1, label: was }, { id: o2, label: were } ]
    prompt: "Choose one"
  - { id: a, type: boolean, prompt: "Include “a”?" }
  - id: you_may_not_consider
    type: boolean
    prompt: "Include “You may not consider statements made by a person who was not a member…”?"
  - id: you_may_not_consider_2
    type: boolean
    prompt: "Include “You may not consider statements made after the goal of the conspiracy…”?"
  - { id: crime_plural, type: boolean, prompt: "Include the “s” in “crime[s]”?" }
  - { id: member_plural, type: boolean, prompt: "Include the “s” in “member[s]”?" }
body:
  - - "In deciding whether the People have proved that "
    - choice: defendant_s_defendant_s
      options:
        - [ "the defendant", { opt: [ s ], if: "@multiple_defendants" } ]
        - - "Defendant"
          - { opt: [ s ], if: "@multiple_defendants" }
          - " "
          - field: "text.name_s_defendant_s"
            hint: "insert name[s] of defendant[s] if codefendant trial and this instruction does not apply to all defendants; see Bench Notes"
    - " committed "
    - { opt: [ "any of" ], if: any }
    - " the crime"
    - { opt: [ s ], if: crime_plural }
    - " charged, you may not consider any statement made out of court by "
    - { field: "text.name_s_coconspirator_s", hint: "insert name[s] of coconspirator[s]" }
    - " unless the People have proved by a preponderance of the evidence that:"
  - elements:
      - n: "1"
        text:
          - "Some evidence other than the statement itself establishes that a conspiracy to commit a crime existed when the statement was made"
        end: ";"
      - n: "2"
        text:
          - { field: "text.name_s_coconspirator_s", hint: "insert name[s] of coconspirator[s]" }
          - " "
          - { choice: was_were, options: [ [ was ], [ were ] ] }
          - " "
          - { opt: [ a ], if: a }
          - " member"
          - { opt: [ s ], if: member_plural }
          - " of and participating in the conspiracy when "
          - { pronoun: defendant, forms: [ he, she, they ] }
          - " made the statement"
        end: ";"
      - n: "3"
        text:
          - { field: "text.name_s_coconspirator_s", hint: "insert name[s] of coconspirator[s]" }
          - " made the statement in order to further the goal of the conspiracy"
        end: ";"
      - n: "4"
        text:
          - "The statement was made before or during the time that "
          - choice: defendant_s_defendant_s
            options:
              - [ "the defendant", { opt: [ s ], if: "@multiple_defendants" } ]
              - - "Defendant"
                - { opt: [ s ], if: "@multiple_defendants" }
                - " "
                - field: "text.name_s_defendant_s_2"
                  hint: "insert name[s] of defendant[s] if codefendant trial and this instruction does not apply to all defendants"
          - " "
          - { when: [ "!@multiple_defendants", "@multiple_defendants" ], options: [ was, were ] }
          - " participating in the conspiracy"
        end: "."
        and: "AND"
  - - "A "
    - { em: statement }
    - " means an oral or written expression, or nonverbal conduct intended to be a substitute for an oral or written expression."
  - - { em: "Proof by a preponderance of the evidence" }
    - " is a different standard of proof than proof beyond a reasonable doubt. A fact is proved by a preponderance of the evidence if you conclude that the fact is more likely than not to be true."
  - - opt:
        - "You may not consider statements made by a person who was not a member of the conspiracy even if the statements helped accomplish the goal of the conspiracy."
      if: you_may_not_consider
  - - opt:
        - "You may not consider statements made after the goal of the conspiracy had been accomplished."
      if: you_may_not_consider_2
