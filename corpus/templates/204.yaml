body:
  - - "The fact that physical restraints have been placed on "
    - { opt: [ the ], if: the }
    - " defendant"
    - { opt: [ s ], if: "@multiple_defendants" }
    - " "
    - opt:
        - field: "text.name_s_defendant_s"
          hint: "insert name[s] of defendant[s] if multiple defendants in case but not all are restrained"
      if: choice
    - " is not evidence. Do not speculate about the reason. You must completely disregard this circumstance in deciding the issues in this case. Do not consider it for any purpose or discuss it during your deliberations."
